apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: example-nodejs-template
  title: Example Node.js Template
  description: Example template using a custom action
spec:
  owner: user:guest
  type: service
  steps:
    - id: create-file
      name: Create File
      action: my:custom:action
      input:
        filename: hello.txt
        contents: |
          Hello from my custom Backstage action!